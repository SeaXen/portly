stages:
  - lint
  - build
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - || exit 1
    - apt-get install -y -qq nodejs >/dev/null
    - pip install ruff
  script:
    - ruff check portly tests
    - npm --prefix portly/frontend ci
    - npm --prefix portly/frontend run lint
    - npm --prefix portly/frontend run test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

backend-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - python3 --version
    - pip install -r requirements.txt
    - pip install pytest httpx pytest-asyncio pytest-cov ruff
  script:
    - python3 -m compileall -q portly
    - export PORTLY_TESTING=1
    - python3 -m pytest tests/ --ignore=tests/e2e -v --cov=portly --cov-fail-under=70
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

e2e-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - || exit 1
    - apt-get install -y -qq nodejs >/dev/null
    - pip install -r requirements.txt
    - pip install pytest pytest-playwright playwright
    - playwright install chromium --with-deps
  script:
    - npm --prefix portly/frontend ci
    - npm --prefix portly/frontend run build
    - python3 -m pytest -o addopts= tests/e2e -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

frontend-build:
  stage: build
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
  script:
    - cd portly/frontend
    - npm ci --no-audit
    - npm run build
    - git -C "$CI_PROJECT_DIR" diff --exit-code -- portly/frontend/dist
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
