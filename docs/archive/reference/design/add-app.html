<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portly – Add custom app</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="c224"><div class="c225"><div class="c226"><div><div class="c227">Add custom app</div><div class="c228">Track an app Portly can’t detect, or add start and stop controls to one it can.</div></div><button class="c077" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="c229"><div class="c093"><button aria-label="Custom app" class="c094">Custom app</button><button aria-label="From Docker" class="c095">From Docker</button><button aria-label="From process" class="c095">From process</button><button aria-label="External URL" class="c095">External URL</button></div><div class="c230"><label class="c214">Name<input type="text" value="Billing API" class="c231"></label><label class="c214">Icon<div class="c232"><div class="c233" aria-hidden="true">B</div><button class="c078">Upload</button><button class="c078">Pick icon</button></div></label></div><div class="c234">Network</div><div class="c230"><label class="c214">Host<input type="text" value="localhost" class="c220"></label><label class="c214">Port<input type="text" value="4000" class="c220"></label></div><div class="c235"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><span class="c064">Port 4000 is free</span> · opens <span class="c213">http://localhost:4000</span></div><div class="c234">Organize</div><div class="c230"><label class="c214">Category<select class="c215"><option>Auto-detect (Development)</option></select></label><label class="c214">Tags<div class="c236"><span class="c111">internal</span><span class="c111">billing</span></div></label></div><div class="c234">Health check</div><div class="c230"><label class="c214">Path<input type="text" value="/health" class="c220"></label><label class="c214">Interval<select class="c215"><option>Every 30 seconds</option></select></label></div><div class="c234">Run controls</div><div class="c230"><label class="c214">Start command<input type="text" value="npm run start" class="c220"></label><label class="c214">Stop command<input type="text" value="auto (stop process)" class="c220"></label></div><div class="c230"><label class="c214">Working directory<input type="text" value="~/projects/billing-api" class="c220"></label><label class="c214">Log file<input type="text" value="~/projects/billing-api/app.log" class="c220"></label></div><div class="c237"><label class="c172">Start on boot<input type="checkbox" class="c173"></label><label class="c172">Pin to favorites<input type="checkbox" checked class="c173"></label><label class="c172">Notify when down<input type="checkbox" checked class="c173"></label></div></div><div class="c238"><span class="c065">Saved to your Portly settings. Commands run on this machine only.</span><div class="c216"><button class="c078">Cancel</button><button class="c080"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add app</button></div></div></div></div>
</body>
</html>
