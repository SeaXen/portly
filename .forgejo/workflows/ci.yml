name: Portly CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          set -e
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip || true
          pip install ruff

      - name: Run backend lint
        run: |
          . .venv/bin/activate
          ruff check portly tests

      - name: Check Node.js environment
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm --prefix portly/frontend ci

      - name: Run frontend lint
        run: npm --prefix portly/frontend run lint

      - name: Run frontend tests
        run: npm --prefix portly/frontend run test

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and pip
        run: |
          set -e
          echo "Checking Python..."
          python3 --version || python --version
          if ! command -v pip3 >/dev/null 2>&1 && ! python3 -m pip --version >/dev/null 2>&1; then
            echo "Installing pip and venv packages..."
            apt-get update -qq && apt-get install -y -qq python3-pip python3-venv python3-full curl || true
          fi
          if ! command -v pip3 >/dev/null 2>&1 && ! python3 -m pip --version >/dev/null 2>&1; then
            echo "Bootstrapping pip via get-pip.py..."
            curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --break-system-packages || true
          fi

      - name: Install dependencies
        run: |
          set -e
          python3 -m venv .venv || python3 -m virtualenv .venv || true
          if [ -d ".venv" ]; then
            echo "Using Python virtual environment"
            . .venv/bin/activate
            pip install --upgrade pip || true
            pip install -r requirements.txt
            pip install pytest httpx pytest-asyncio pytest-cov ruff
          else
            echo "Using system pip with break-system-packages"
            python3 -m pip install --break-system-packages -r requirements.txt
            python3 -m pip install --break-system-packages pytest httpx pytest-asyncio pytest-cov ruff
          fi

      - name: Verify Python syntax
        run: |
          if [ -f .venv/bin/activate ]; then
            . .venv/bin/activate
          fi
          python3 -m compileall -q portly

      - name: Run Pytest test suite
        run: |
          if [ -f .venv/bin/activate ]; then
            . .venv/bin/activate
          fi
          export PORTLY_TESTING=1
          python3 -m pytest tests/ --ignore=tests/e2e -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Node.js environment
        run: |
          node --version
          npm --version

      - name: Build frontend production bundle
        working-directory: portly/frontend
        run: |
          npm ci --no-audit
          npm run build

  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Node.js environment
        run: |
          node --version
          npm --version

      - name: Build frontend
        working-directory: portly/frontend
        run: |
          npm ci --no-audit
          npm run build

      - name: Install dependencies
        run: |
          set -e
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip || true
          pip install -r requirements.txt
          pip install pytest pytest-playwright playwright
          playwright install chromium --with-deps

      - name: Run E2E test suite
        run: |
          . .venv/bin/activate
          python3 -m pytest -o addopts= tests/e2e -v
