name: Portly CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python environment
        run: |
          python3 --version || python --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pytest httpx pytest-asyncio pytest-cov

      - name: Verify Python syntax
        run: |
          python3 -m py_compile portly/*.py
          python3 -m py_compile portly/backend/*.py
          python3 -m py_compile portly/backend/actions/*.py
          python3 -m py_compile portly/backend/discovery/*.py

      - name: Run Pytest test suite
        run: |
          python3 -m pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Node.js environment
        run: |
          node --version
          npm --version

      - name: Build frontend production bundle
        working-directory: portly/frontend
        run: |
          npm ci
          npm run build
