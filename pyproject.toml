[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portly"
version = "1.1.0"
description = "A self-hosted port, process, and container management dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Portly Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psutil>=5.9.0",
    "docker>=7.1.0",
    "sse-starlette>=2.1.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
portly = "portly.cli:main"

[tool.setuptools.packages.find]
include = ["portly*"]

[tool.setuptools.package-data]
portly = ["frontend/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "node_modules", "dist", "build"]
addopts = "-ra --ignore=tests/e2e"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Legacy baseline: these pre-existing violations are left untouched on purpose.
ignore = ["E501", "F401", "F541", "E402", "E741", "I001"]
